# Builds the desktop app on Windows and macOS on every push to main, runs the tests there,
# and publishes the downloads to one fixed release: .../releases/tag/latest
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MagnetStudio-Windows.zip
          - os: macos-latest            # Apple Silicon (M1/M2/M3/M4)
            asset: MagnetStudio-macOS-AppleSilicon.zip
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[ai,dev]"
      - name: Build (PyInstaller)
        run: python packaging/build.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MagnetStudio -DestinationPath ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/MagnetStudio.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 14

  # Separate job: test results on Windows/Mac never hold back the download.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[ai,dev]" pytest-timeout
      - name: Tests (a stuck test fails after 4 min with a traceback)
        run: python -m pytest -v --timeout=240 -o faulthandler_timeout=230

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la assets
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest assets/*.zip --repo "$REPO" --prerelease \
            --target "${{ github.sha }}" \
            --title "MagnetStudio – גרסה אחרונה (build ${{ github.run_number }})" \
            --notes "נבנה אוטומטית מ-commit ${{ github.sha }}.

          **Windows:** להוריד את MagnetStudio-Windows.zip → לחלץ → להפעיל MagnetStudio\\MagnetStudio.exe.
          בפעם הראשונה Windows עלול להציג 'Windows protected your PC' → More info → Run anyway (התוכנה לא חתומה).

          **Mac (M1 ומעלה):** להוריד את MagnetStudio-macOS-AppleSilicon.zip → לחלץ → לגרור את MagnetStudio ל-Applications.
          בפעם הראשונה: קליק ימני על האפליקציה → Open → Open (התוכנה לא חתומה)."

  # run.bat / run.command straight from the repo (what Shahar double-clicks), with and without uv.
  run-from-source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        via: [python, uv]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      MAGNETSTUDIO_EXIT_AFTER_MS: "6000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.via == 'python'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        if: matrix.via == 'uv'
      - name: Run (Windows, run.bat)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set MAGNETSTUDIO_HOME=%RUNNER_TEMP%\ms_home
          call run.bat || exit /b 1
          call run.bat || exit /b 1
          findstr /C:"exiting (code 0)" "%RUNNER_TEMP%\ms_home\logs\magnetstudio.log"
      - name: Run (macOS, run.command)
        if: runner.os == 'macOS'
        run: |
          export MAGNETSTUDIO_HOME="$RUNNER_TEMP/ms_home"
          ./run.command
          ./run.command
          grep "exiting (code 0)" "$MAGNETSTUDIO_HOME/logs/magnetstudio.log"
