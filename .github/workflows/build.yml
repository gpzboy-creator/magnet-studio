# Builds the desktop app on Windows and macOS on every push to main, runs the tests there,
# and publishes the downloads to one fixed release: .../releases/tag/latest
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MagnetStudio-Windows.zip
          - os: macos-latest            # Apple Silicon (M1/M2/M3/M4)
            asset: MagnetStudio-macOS-AppleSilicon.zip
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[ai,dev]"
      - name: Build (PyInstaller)
        run: python packaging/build.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MagnetStudio -DestinationPath ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/MagnetStudio.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 14

  # Separate job: test results on Windows/Mac never hold back the download.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[ai,dev]" pytest-timeout
      - name: Tests (a stuck test fails after 4 min with a traceback)
        run: python -m pytest -v --timeout=240 -o faulthandler_timeout=230

  release:
    # Publishes whatever built. A platform whose build failed (e.g. GitHub had no free Mac runner)
    # keeps its previous download – the release is updated, never wiped.
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
        continue-on-error: true
      - name: Add the launchers (download once, they keep the app up to date)
        run: |
          mkdir -p assets
          (cd launcher && zip -X ../assets/MagnetStudio-Launcher-Windows.zip MagnetStudio.bat \
                       && zip -X ../assets/MagnetStudio-Launcher-macOS.zip MagnetStudio.command)
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          ls -la assets
          cat > notes.md <<'NOTES'
          **הכי נוח – מפעיל שמתעדכן לבד:** MagnetStudio-Launcher-Windows.zip / MagnetStudio-Launcher-macOS.zip.
          לחלץ לתיקייה קבועה וללחוץ לחיצה כפולה בכל פעם: בודק עדכון, מוריד אם יש, ומפעיל. בלי אינטרנט – מפעיל את הגרסה שכבר יש.

          **Windows ידני:** MagnetStudio-Windows.zip → לחלץ → MagnetStudio\MagnetStudio.exe.
          בפעם הראשונה: Windows protected your PC → More info → Run anyway (התוכנה לא חתומה).

          **Mac (M1 ומעלה) ידני:** MagnetStudio-macOS-AppleSilicon.zip → לחלץ → לגרור ל-Applications → קליק ימני → Open.
          NOTES
          echo "" >> notes.md
          echo "Commit: $SHA (build ${{ github.run_number }})" >> notes.md
          if ! gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create latest --repo "$REPO" --prerelease --target "$SHA" --title "MagnetStudio" --notes "-"
          fi
          gh api -X PATCH "repos/$REPO/git/refs/tags/latest" -f sha="$SHA" -F force=true >/dev/null || true
          gh release edit latest --repo "$REPO" --prerelease \
            --title "MagnetStudio – גרסה אחרונה (build ${{ github.run_number }})" --notes-file notes.md
          gh release upload latest assets/*.zip --repo "$REPO" --clobber

  # run.bat / run.command straight from the repo (what Shahar double-clicks), with and without uv.
  run-from-source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        via: [python, uv]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      MAGNETSTUDIO_EXIT_AFTER_MS: "6000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.via == 'python'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        if: matrix.via == 'uv'
      - name: Run (Windows, run.bat)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set MAGNETSTUDIO_HOME=%RUNNER_TEMP%\ms_home
          call run.bat || exit /b 1
          call run.bat || exit /b 1
          findstr /C:"exiting (code 0)" "%RUNNER_TEMP%\ms_home\logs\magnetstudio.log"
      - name: Run (macOS, run.command)
        if: runner.os == 'macOS'
        run: |
          export MAGNETSTUDIO_HOME="$RUNNER_TEMP/ms_home"
          ./run.command
          ./run.command
          grep "exiting (code 0)" "$MAGNETSTUDIO_HOME/logs/magnetstudio.log"

  # The launchers (launcher/) against the real release, from a folder with a space in its name:
  # 1st run downloads + starts the app, 2nd run must say "up to date" and start it again.
  launcher:
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      MAGNETSTUDIO_EXIT_AFTER_MS: "6000"
      MAGNETSTUDIO_UPDATER_WAIT: "1"
      MAGNETSTUDIO_UPDATER_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "MAGNETSTUDIO_HOME=%RUNNER_TEMP%\ms_home"
          set "D=%RUNNER_TEMP%\Magnet Studio Test"
          mkdir "%D%" && copy launcher\MagnetStudio.bat "%D%\" || exit /b 1
          call "%D%\MagnetStudio.bat" || exit /b 1
          call "%D%\MagnetStudio.bat" > "%RUNNER_TEMP%\second.txt" || exit /b 1
          type "%RUNNER_TEMP%\second.txt"
          findstr /C:"up to date" "%RUNNER_TEMP%\second.txt" || exit /b 1
          findstr /C:"exiting (code 0)" "%MAGNETSTUDIO_HOME%\logs\magnetstudio.log"
      - name: macOS
        if: runner.os == 'macOS'
        run: |
          export MAGNETSTUDIO_HOME="$RUNNER_TEMP/ms_home"
          D="$RUNNER_TEMP/Magnet Studio Test"; mkdir -p "$D" && cp launcher/MagnetStudio.command "$D/"
          "$D/MagnetStudio.command"
          "$D/MagnetStudio.command" | tee "$RUNNER_TEMP/second.txt"
          grep -q "up to date" "$RUNNER_TEMP/second.txt"
          grep "exiting (code 0)" "$MAGNETSTUDIO_HOME/logs/magnetstudio.log"
